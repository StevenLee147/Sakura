name: Build

on:
  push:
    branches: [ main, develop ]
    tags:     [ 'v*' ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing version tag to build, test, and publish'
        required: true
        default: 'v0.7.0-alpha'
        type: string

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.release_tag) || github.ref }}
  cancel-in-progress: true

jobs:
  # ── 构建矩阵（Debug + Release，Windows） ──────────────────────────────────
  build:
    name: ${{ matrix.config.name }}
    # Match the Visual Studio 17 2022 generator and v143 CRT used by packaging.
    runs-on: windows-2022

    strategy:
      fail-fast: false
      matrix:
        config:
          - name: "Windows Debug (MSVC x64)"
            configure_preset: "debug"
            build_preset:     "debug"
            artifact_suffix:  "debug"
            run_tests:        true     # Debug 构建附带单测

          - name: "Windows Release (MSVC x64)"
            configure_preset: "release"
            build_preset:     "release"
            artifact_suffix:  "release"
            run_tests:        true

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.release_tag) || github.ref }}

      - name: Verify release version
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $version = Get-Content VERSION.json -Raw | ConvertFrom-Json
          if ($env:RELEASE_TAG -notmatch '^v\d+\.\d+\.\d+(?:-[A-Za-z0-9.-]+)?$' -or $version.tag -ne $env:RELEASE_TAG) {
            throw "Release tag '$env:RELEASE_TAG' does not match VERSION.json '$($version.tag)'."
          }

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: 'ffc071e0c08432c60c9b64f00334c0227667931b'
          vcpkgJsonGlob: 'vcpkg.json'

      - name: Configure CMake (${{ matrix.config.configure_preset }})
        uses: lukka/run-cmake@v10
        with:
          configurePreset: ${{ matrix.config.configure_preset }}
          configurePresetAdditionalArgs: >-
            ${{ matrix.config.run_tests
              && '["-DSAKURA_BUILD_TESTS=ON"]'
              || '[]' }}

      - name: Build (${{ matrix.config.build_preset }})
        uses: lukka/run-cmake@v10
        with:
          buildPreset: ${{ matrix.config.build_preset }}

      - name: Run unit tests (CTest)
        if: matrix.config.run_tests
        shell: pwsh
        run: |
          $config = if ("${{ matrix.config.artifact_suffix }}" -eq "debug") { "Debug" } else { "Release" }
          ctest --test-dir "build/${{ matrix.config.artifact_suffix }}" `
                --build-config $config `
                --output-on-failure `
                --no-tests=error `
                --timeout 60
        env:
          CTEST_OUTPUT_ON_FAILURE: 1

      - name: Setup Node.js for Online Server E2E
        if: matrix.config.artifact_suffix == 'release'
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run Online Server Tests & WinHTTP E2E (--verify-online)
        if: matrix.config.artifact_suffix == 'release'
        shell: pwsh
        run: |
          Push-Location server
          npm install --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Pop-Location

          $port = 18787
          $env:PORT = "$port"
          $env:SAKURA_SERVER_DATA_DIR = "$PWD/build/e2e-server-data"
          $env:SAKURA_USER_DIR = "$PWD/build/e2e-client-user"
          $env:SAKURA_JWT_SECRET = "ci-e2e-jwt-secret"
          New-Item -ItemType Directory -Force -Path $env:SAKURA_SERVER_DATA_DIR | Out-Null
          New-Item -ItemType Directory -Force -Path $env:SAKURA_USER_DIR | Out-Null

          $srv = Start-Process -FilePath "node" -ArgumentList "server/dist/index.js" -PassThru -NoNewWindow
          try {
            $ready = $false
            for ($i = 0; $i -lt 40; $i++) {
              try {
                $resp = Invoke-WebRequest -Uri "http://127.0.0.1:$port/api/v1/health" -UseBasicParsing -TimeoutSec 2
                if ($resp.StatusCode -eq 200) { $ready = $true; break }
              } catch {}
              Start-Sleep -Milliseconds 300
            }
            if (-not $ready) { throw "Online server failed to start on port $port" }
            & "build/release/Release/Sakura.exe" --verify-online "http://127.0.0.1:$port"
            if ($LASTEXITCODE -ne 0) { throw "Sakura.exe --verify-online failed with exit code $LASTEXITCODE" }
          } finally {
            if ($srv -and -not $srv.HasExited) { Stop-Process -Id $srv.Id -Force -ErrorAction SilentlyContinue }
          }

      - name: Gather artifacts
        shell: pwsh
        run: |
          $preset   = "${{ matrix.config.artifact_suffix }}"
          $config   = if ($preset -eq "debug") { "Debug" } else { "Release" }
          $outDir   = "artifacts/$preset"
          $buildDir = "build/$preset/$config"

          New-Item -ItemType Directory -Force -Path $outDir | Out-Null

          if ($preset -eq "release") {
            if (-not (Get-Command iscc -ErrorAction SilentlyContinue) -and -not (Test-Path 'C:/Program Files (x86)/Inno Setup 6/ISCC.exe')) {
              choco install innosetup -y --no-progress
            }
            New-Item -ItemType Directory -Force -Path artifacts/dist | Out-Null
            python scripts/package_release.py --build-dir "build/$preset" --output-dir artifacts/package
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $package = Get-ChildItem artifacts/package -Directory | Select-Object -First 1
            Copy-Item "$($package.FullName)/*" $outDir -Recurse
            $archive = Get-ChildItem artifacts/package -Filter '*.zip' | Select-Object -First 1
            $installer = Get-ChildItem artifacts/package -Filter '*-setup.exe' | Select-Object -First 1
            if (-not $archive -or -not $installer) {
              throw "Missing dual release artifacts (.zip and -setup.exe) in artifacts/package."
            }
            Copy-Item $archive.FullName artifacts/dist/Sakura-win64.zip
            Copy-Item $installer.FullName artifacts/dist/Sakura-win64-setup.exe
          } else {
            Copy-Item "$buildDir/Sakura.exe" $outDir
            Copy-Item "$buildDir/*.dll" $outDir
            Copy-Item "$buildDir/resources" "$outDir/resources" -Recurse
            Copy-Item "$buildDir/config" "$outDir/config" -Recurse
          }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Sakura-${{ matrix.config.artifact_suffix }}-${{ github.sha }}
          path: artifacts/${{ matrix.config.artifact_suffix }}/
          retention-days: 14
          if-no-files-found: warn

      - name: Upload release distribution
        if: matrix.config.artifact_suffix == 'release' && (github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/'))
        uses: actions/upload-artifact@v4
        with:
          name: release-dist
          path: |
            artifacts/dist/Sakura-win64.zip
            artifacts/dist/Sakura-win64-setup.exe
          retention-days: 1

      - name: Build summary
        if: always()
        shell: pwsh
        run: |
          $preset  = "${{ matrix.config.artifact_suffix }}"
          $config  = if ($preset -eq "debug") { "Debug" } else { "Release" }
          $exePath = "build/$preset/$config/Sakura.exe"
          $exists  = Test-Path $exePath
          $status  = if ($exists) { ":white_check_mark: Build succeeded" } else { ":x: Build failed" }
          $md = "### $status`n| Property | Value |`n|----------|-------|`n| Preset | ``$preset`` |`n| Commit | ``${{ github.sha }}`` |"
          Add-Content $env:GITHUB_STEP_SUMMARY $md

  # ── Linux 逻辑层单测（ubuntu，Ninja，ci-linux preset） ─────────────────────
  test-linux:
    name: "Linux Tests (Ninja)"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.release_tag) || github.ref }}

      - name: Install system dependencies for core libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build pkg-config

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: 'ffc071e0c08432c60c9b64f00334c0227667931b'
          vcpkgJsonGlob: 'vcpkg.json'

      - name: Configure CMake (ci-linux)
        uses: lukka/run-cmake@v10
        with:
          configurePreset: ci-linux

      - name: Build (ci-linux)
        uses: lukka/run-cmake@v10
        with:
          buildPreset: ci-linux

      - name: Run unit tests (CTest)
        uses: lukka/run-cmake@v10
        with:
          testPreset: ci-linux
        env:
          CTEST_OUTPUT_ON_FAILURE: 1

      - name: Publish test metadata
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-linux-${{ github.sha }}
          path: build/ci-linux/CTestTestfile.cmake
          if-no-files-found: ignore
          retention-days: 7

  # ── GitHub Release（tag push 或按已有标签手动发布） ────────────────────────
  release:
    name: Create GitHub Release
    needs: [ build, test-linux ]
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write

    steps:
      - name: Download release distribution
        uses: actions/download-artifact@v4
        with:
          name: release-dist
          path: dist/

      - name: Prepare dual artifacts and SHA256SUMS
        run: |
          TAG="$RELEASE_TAG"
          mv dist/Sakura-win64.zip "dist/Sakura-${TAG}-win64.zip"
          mv dist/Sakura-win64-setup.exe "dist/Sakura-${TAG}-win64-setup.exe"
          (
            cd dist
            sha256sum "Sakura-${TAG}-win64-setup.exe" "Sakura-${TAG}-win64.zip" > "Sakura-${TAG}-SHA256SUMS.txt"
          )

      - name: Determine pre-release flag
        id: prerelease
        run: |
          TAG="$RELEASE_TAG"
          if [[ "$TAG" == *"-dev"* || "$TAG" == *"-alpha"* || "$TAG" == *"-beta"* || "$TAG" == *"-rc"* ]]; then
            echo "value=true" >> $GITHUB_OUTPUT
          else
            echo "value=false" >> $GITHUB_OUTPUT
          fi

      - name: Create GitHub Release (with 5xx retry resilience)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ env.RELEASE_TAG }}
          IS_PRE: ${{ steps.prerelease.outputs.value }}
        run: |
          PRE_FLAG=""
          if [[ "$IS_PRE" == "true" ]]; then
            PRE_FLAG="--prerelease"
          else
            PRE_FLAG="--latest"
          fi
          FILES=(
            "dist/Sakura-${TAG}-win64-setup.exe"
            "dist/Sakura-${TAG}-win64.zip"
            "dist/Sakura-${TAG}-SHA256SUMS.txt"
          )
          for attempt in $(seq 1 8); do
            if gh release view "$TAG" >/dev/null 2>&1; then
              if gh release upload "$TAG" "${FILES[@]}" --clobber && gh release edit "$TAG" --tag "$TAG" --draft=false $PRE_FLAG; then
                exit 0
              fi
            else
              if gh release create "$TAG" "${FILES[@]}" --title "Sakura-樱 ${TAG}" --generate-notes $PRE_FLAG; then
                exit 0
              fi
            fi
            echo "[release] Attempt ${attempt} hit transient GitHub error; retrying..."
            sleep $((attempt * 4))
          done
          exit 1
